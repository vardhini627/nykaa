<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nykaa Login or Signup</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link rel="stylesheet" href="nkya.css">
    <link rel="appicon" href="./unnamed.png">
</head>

<body>

    <div class="login-container">
        <h1>Login or Signup</h1>

        <p class="subtitle">
            Get started & grab best offers!
        </p>
        <div class="mobile-section">

            <div class="mobile-input-box">

                <label>Mobile Number</label>

                <input
                    type="tel"
                    placeholder="+91 "
                    maxlength="14">

            </div>

            <a href="otp.html" class="otp-btn">
                Send OTP
            </a>

        </div>

        <div class="or-section">

            <span></span>

            <p>Or sign in using</p>

            <span></span>

        </div>

        <a href="#" class="mobile-email-btn">

            <span>
                Sign in with Mobile / Email
            </span>

            <span class="arrow">
                ›
            </span>

        </a>

        <a href="#" class="google-btn">

            <span>
                Continue with Google
            </span>

            <span class="google-letter">
                G
            </span>

        </a>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

</body>
</html>
