<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nykaa OTP Verification</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="nkya.css">
</head>

<body>

    <div class="otp-page">

        <div class="left-section">
        </div>
    <div class="right-section">

    <div class="top-navigation">

        <button class="back-btn">←</button>

        <button class="skip-btn">Skip</button>

    </div>


    <div class="otp-center d-flex justify-content-center align-items-center">

        <div class="otp-container">

            <div class="logo"><img src="https://tse3.mm.bing.net/th/id/OIP.nbBm5PvrCE-91eVWruXg3QHaE9?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="" width="100px"></div>

            <h1>OTP Verification</h1>

            <p class="mobile-text">
                Enter OTP received on 7382994829
            </p>

            <div class="otp-boxes">
                <input type="text" maxlength="1" class="otp-input">
                <input type="text" maxlength="1" class="otp-input">
                <input type="text" maxlength="1" class="otp-input">
                <input type="text" maxlength="1" class="otp-input">
                <input type="text" maxlength="1" class="otp-input">
                <input type="text" maxlength="1" class="otp-input">
            </div>

            <p class="resend-text">
                Resend OTP in <span>40 Sec</span>
            </p>

            <p class="terms">
                By continuing, I agree to Nykaa's
                <a href="#">T&Cs</a>
            </p>

        </div>

    </div>

</div>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
